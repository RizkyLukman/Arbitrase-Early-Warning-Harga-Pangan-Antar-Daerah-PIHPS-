# Konfigurasi proyek PIHPS. Semua parameter analisis diletakkan di sini, bukan di kode.
# Detail endpoint & temuan akses data: docs/data_access.md

sumber:
  base_url: "https://www.bi.go.id/hargapangan/WebSite/TabelHarga/"
  endpoint_harga: "GetGridDataKomoditas"
  user_agent: "PIHPS-portfolio-research/0.1 (personal data-analysis portfolio project)"
  jeda_detik: 2          # jeda minimum antar request
  timeout_detik: 120
  max_retry: 4           # retry dengan backoff eksponensial
  potongan: "bulan"      # rentang 1 tahun untuk semua kota timeout (>180 detik)
  tipe_laporan: 1        # 1 = harian; agregasi mingguan dilakukan sendiri

periode:
  # Data tersedia sejak 2018. Keputusan user (2026-10-25): mulai 2023-07-01 sesuai brief.
  # Konsekuensi: hanya 3 musim Idul Fitri (2024, 2025, 2026) untuk pola musiman dan uji peringatan dini.
  tanggal_mulai: "2023-07-01"
  tanggal_selesai: "auto_h_minus_2"   # tanggal pengambilan dikurangi 2 hari kalender

jenis_pasar:
  1: "Pasar Tradisional"
  2: "Pasar Modern"
  3: "Pedagang Besar"
  4: "Produsen"

komoditas_fokus:   # id dari GetRefCommodityAndCategory
  com_14: "Cabai Merah Keriting"
  com_16: "Cabai Rawit Merah"
  com_11: "Bawang Merah Ukuran Sedang"
  com_12: "Bawang Putih Ukuran Sedang"
  com_7:  "Daging Ayam Ras Segar"
  com_10: "Telur Ayam Ras Segar"

komoditas_opsional: {}   # mis. com_3 (Beras Medium I), com_17 (Minyak Goreng Curah)

wilayah:
  # Provinsi yang diunduh (kosong = semua). Pulau Jawa: Banten, Jabar, DKI, Jateng, DIY, Jatim.
  # Seluruh kota Jawa diunduh agar analisis kota penentu arah tidak terbatas pada 10 kota di bawah.
  provinsi_id: [11, 12, 13, 14, 15, 16]

  # PERLU_VERIFIKASI: pemilihan kota sumber berdasarkan pengetahuan umum tentang sentra produksi,
  # belum dari data. Ketersediaan data sudah dicek (Sep 2026), lihat docs/data_access.md.
  kota_tujuan:
    34: "Kota Jakarta Pusat"
    27: "Kota Bandung"
    35: "Kota Semarang"
    42: "Kota Surabaya"

  kota_sumber:
    29: { nama: "Kota Tasikmalaya", komoditas: [com_14] }          # dekat Garut
    37: { nama: "Kota Tegal",       komoditas: [com_11] }          # dekat Brebes
    44: { nama: "Kota Kediri",      komoditas: [com_16, com_10, com_7] }
    45: { nama: "Kab. Jember",      komoditas: [com_16] }
    46: { nama: "Kab. Banyuwangi",  komoditas: [com_16] }
    48: { nama: "Kota Probolinggo", komoditas: [com_11] }
  # Bawang putih: sebagian besar impor, tidak dianalisis rutenya; hanya gejolak harga.

cleaning:   # ambang dipakai di notebooks/01_eda.ipynb dan src/clean.py; dasar penetapannya di docs/data_profile.md
  libur_ambang_tidak_berubah: 0.90   # hari dianggap "libur diisi harga sebelumnya" jika >90% seri tradisional tidak berubah
  gap_ffill_maks_hari: 5             # celah <= 5 hari kerja diisi forward-fill (is_imputed); lebih panjang tetap NaN
  usang_run_hari: 60                 # harga tidak berubah >= 60 hari kerja berturut-turut -> is_usang
  minggu_min_hari_nyata: 3           # minggu dengan < 3 hari pencacahan nyata -> minggu_tipis
  duplikat_kota_dibuang: [787]       # "Kota Surakarta" pasar modern; duplikat dari id 36 "Kota Surakarta (Solo)"
  outlier:
    jendela_median_hari: 21          # median bergulir (terpusat)
    k_mad: 5                         # aturan brief: |x - median| > 5 x MAD
    # Aturan A "lonjakan tajam" (HANYA PENANDA, nilai tetap dipakai): deviasi > max(k_mad x MAD, lonjakan_deviasi_min),
    # sementara hari sebelum & sesudahnya normal. Lantai 25% dipakai karena MAD ~ 0 pada seri yang datar.
    lonjakan_deviasi_min: 0.25
    # Aturan B & C "salah input" (nilai dikosongkan pada versi bersih):
    rasio_ekstrem: 3                 # B: x >= 3 x median bergulir atau x <= median / 3
    rasio_lintas_kota: 5             # C: x >= 5 x atau <= 1/5 median kota lain (komoditas & jenis pasar & hari sama).
                                     #    Ambang 3 terlalu ketat: menandai harga produsen cabai yang memang rendah saat panen.

features:   # Tahap 3 (src/features.py). Dasar: notebooks/02_cleaning.ipynb §7 (audit), keputusan user 2026-10-26.
  frekuensi: "W-FRI"                 # minggu berakhir Jumat (pencacahan hanya Senin-Jumat)
  # Cara mengambil satu harga per minggu dari pengamatan NYATA (harga_bersih yang bukan is_imputed):
  #   median   = median hari nyata (pasar tradisional dicatat setiap hari)
  #   terakhir = nilai nyata terakhir dalam minggu (pedagang besar dicatat ~Kamis, modern ~Selasa-Rabu, produsen sesekali;
  #              median akan didominasi salinan harga minggu lalu)
  agregasi_mingguan: {1: median, 2: terakhir, 3: terakhir, 4: terakhir}
  rolling_minggu: [4, 12]            # rata-rata bergerak harga & gejolak (std log-return)
  yoy_lag_minggu: 52
  zscore_baseline_minggu: 52         # z-score LEVEL harga vs rata-rata & std 52 minggu SEBELUMNYA (tanpa look-ahead)
  zscore_min_minggu: 26
  perubahan_lag_minggu: 4            # pct_4w: perubahan harga vs 4 minggu lalu (definisi lonjakan Q6 di brief)
  zscore_return_baseline_minggu: 52  # zscore_return: KENAIKAN mingguan vs log-return 52 minggu SEBELUMNYA (aturan alert Q6)
  zscore_return_min_minggu: 26
  idul_fitri_jendela: [-12, 4]       # minggu_ke_idul_fitri; minggu 0 = minggu yang memuat tanggal Idulfitri
  # Seri yang tetap disimpan tetapi DITANDAI agar tidak dipakai untuk analisis tren (audit pasca-cleaning):
  seri_dikecualikan:
    - {jenis_pasar_id: 1, komoditas_id: com_14, kota_id: 45,  alasan: "bolong 73% (baris hilang Des 2023-Mar 2026)"}
    - {jenis_pasar_id: 2, komoditas_id: com_16, kota_id: 46,  alasan: "bolong 90%"}
    - {jenis_pasar_id: 2, komoditas_id: com_11, kota_id: 46,  alasan: "bolong 65%"}
    - {jenis_pasar_id: 2, komoditas_id: com_12, kota_id: 46,  alasan: "bolong 63%"}
    - {jenis_pasar_id: 2, komoditas_id: com_11, kota_id: 39,  alasan: "bolong 13% (2 bulan hilang)"}
    - {jenis_pasar_id: 4, komoditas_id: com_7,  kota_id: 135, alasan: "baru mulai Jan 2026"}
    - {jenis_pasar_id: 2, komoditas_id: com_14, kota_id: 135, alasan: "harga ~1/3 kota lain berbulan-bulan (dugaan per kemasan)"}
    - {jenis_pasar_id: 2, komoditas_id: com_16, kota_id: 135, alasan: "harga ~1/3 kota lain berbulan-bulan (dugaan per kemasan)"}

analisis:   # Tahap 4 (src/analysis/*.py). Hasil tabel -> reports/tables/, grafik -> reports/figures/
  q1_gejolak:
    jenis_pasar_id: 1               # gejolak hanya dari pasar tradisional (pasar lain jarang diperbarui; audit §7.2)
    pembanding_jenis_pasar_id: 2    # pasar modern, sebagai pembanding berbatasan (diberi catatan)
    min_minggu: 100                 # seri dengan < 100 log-return mingguan tidak dirangking
    top_n_kota: 5
  q2_rute:
    harga_sumber_jenis_pasar_id: 3  # pedagang besar di kota sumber (harga beli distributor yang realistis; brief Q2)
    harga_tujuan_jenis_pasar_id: 1  # pasar tradisional di kota tujuan (analisis UTAMA, sesuai brief)
    # Uji ketahanan: harga eceran memuat margin pengecer; distributor biasanya menjual ke pedagang di kota tujuan.
    # Ulangi dengan harga PEDAGANG BESAR di kota tujuan sebagai harga jual (lebih konservatif).
    uji_ketahanan_tujuan_jenis_pasar_id: 3
    kecualikan_minggu_sumber_usang: true   # harga sumber tidak berubah >= 60 hari kerja -> bukan harga beli aktual
    jendela_terakhir_minggu: 10     # "Minggu untung: x dari 10" (10 minggu terakhir)
    # Rute dinyatakan LAYAK jika pada skenario konservatif (pengali biaya_logistik.sensitivitas.skenario_konservatif):
    layak_min_porsi_minggu_untung: 0.6   # untung pada >= 60% minggu yang punya data
    layak_median_untung_positif: true    # dan median untung per kg > 0
  q3_leadlag:
    jenis_pasar_id: 1               # pasar tradisional (satu-satunya yang dicatat harian; audit §7.2)
    lag_minggu: [1, 2, 3, 4]        # jeda yang diuji (lag 0 = bergerak bersamaan, dilaporkan sebagai pembanding)
    min_minggu_bersama: 100         # pasangan dengan < 100 minggu data bersama tidak diuji
    alpha_bh: 0.05                  # tingkat kesalahan (false discovery rate) setelah koreksi Benjamini-Hochberg
    korelasi_kuat: 0.30             # dashboard: hubungan "kuat" jika korelasi >= 0,30
    korelasi_sedang: 0.15           # "sedang" jika 0,15 - 0,30; di bawahnya tidak ditampilkan
    # Kota "penentu arah" = kejutan harganya mendahului rata-rata SEMUA kota lain ("pasar"): lolos BH, korelasi >= sedang,
    # dan lebih kuat daripada arah sebaliknya (pasar mendahului kota itu). Kebalikannya = kota "pengikut".
    # (Versi per pasangan kota menghasilkan 12-22 "penentu arah" per komoditas -> tidak berguna untuk keputusan.)
    top_n_per_kota_tujuan: 3        # kota yang perlu dipantau untuk setiap kota tujuan (dari uji per pasangan)
    # Prewhitening: buang momentum tiap kota (regresi log-return pada lag-nya sendiri 1..p) sebelum korelasi silang.
    # Tanpa ini, momentum + pergerakan bersamaan membuat 26-53% pasangan kota tampak "saling mendahului" (semu).
    prewhitening_ar_lag: 4
    adf_alpha: 0.05                 # uji stasioneritas (ADF) sebelum Granger
    granger_maxlag: 4               # Granger hanya pendukung; dijalankan untuk pasangan yang lolos BH
  q4_musiman:
    jenis_pasar_id: 1
    baseline_minggu: [-12, -9]      # "harga normal" = rata-rata minggu -12 s/d -9 sebelum Idulfitri (brief)
    jendela_minggu: [-8, 4]
    ambang_naik: 0.05               # "naik signifikan" = >= 5% di atas harga normal (median antar kota) ...
    min_tahun_naik: 2               # ... pada >= 2 dari 3 tahun, dan bertahan sampai minggu -1

rantai_pasok:   # Q5: tambahan harga produsen -> pedagang besar -> pasar tradisional (src/analysis/margin.py)
  # Analisis UTAMA (sesuai brief): hanya kota yang punya ketiga tingkat dengan NAMA SAMA (mis. Kota Tegal, Kab. Jember).
  # Analisis TAMBAHAN (disetujui user 2026-10-26): harga produsen diambil dari kabupaten sentra di sekitar kota.
  # PERLU_VERIFIKASI: pasangan dipilih dari kedekatan administratif (kabupaten yang mengelilingi kota) atau pengetahuan
  # umum tentang sentra, BUKAN dari data rantai pasok. Ketersediaan data dicek 2026-10-26 (tests/test_features.py).
  # `komoditas` = komoditas yang punya data produsen di kabupaten itu DAN data pedagang besar + tradisional di kota itu.
  pasangan_kota_kabupaten:
    - {kota_id: 44,  kota: "Kota Kediri",      produsen_kota_id: 128, produsen: "Kab. Kediri",      komoditas: [com_16, com_14],                 dasar: "kabupaten yang mengelilingi kota", status: PERLU_VERIFIKASI}
    - {kota_id: 44,  kota: "Kota Kediri",      produsen_kota_id: 120, produsen: "Kab. Nganjuk",     komoditas: [com_11],                         dasar: "sentra bawang merah, bertetangga", status: PERLU_VERIFIKASI}
    - {kota_id: 48,  kota: "Kota Probolinggo", produsen_kota_id: 137, produsen: "Kab. Probolinggo", komoditas: [com_11],                         dasar: "kabupaten yang mengelilingi kota", status: PERLU_VERIFIKASI}
    - {kota_id: 29,  kota: "Kota Tasikmalaya", produsen_kota_id: 106, produsen: "Kab. Tasikmalaya", komoditas: [com_16, com_14, com_10, com_7], dasar: "kabupaten yang mengelilingi kota", status: PERLU_VERIFIKASI}
    - {kota_id: 29,  kota: "Kota Tasikmalaya", produsen_kota_id: 95,  produsen: "Kab. Garut",       komoditas: [com_16, com_11],                 dasar: "sentra hortikultura, bertetangga (data cabai merah keriting produsen Garut tidak ada)", status: PERLU_VERIFIKASI}
    - {kota_id: 135, kota: "Kota Blitar",      produsen_kota_id: 132, produsen: "Kab. Blitar",      komoditas: [com_16, com_14, com_10, com_7],  dasar: "kabupaten yang mengelilingi kota", status: PERLU_VERIFIKASI}
    - {kota_id: 43,  kota: "Kota Malang",      produsen_kota_id: 113, produsen: "Kab. Malang",      komoditas: [com_16, com_11, com_10, com_7],  dasar: "kabupaten yang mengelilingi kota", status: PERLU_VERIFIKASI}
    - {kota_id: 28,  kota: "Kota Cirebon",     produsen_kota_id: 103, produsen: "Kab. Cirebon",     komoditas: [com_16, com_14, com_11, com_10, com_7], dasar: "kabupaten yang mengelilingi kota", status: PERLU_VERIFIKASI}
  # Tidak dipakai (dicek 2026-10-26): Kota Madiun (produsen Kab. Madiun tanpa data), Kab. Banyuwangi (tanpa data produsen),
  # Kota Serang (tanpa data pedagang besar), Kota Kediri untuk telur & ayam (Kab. Kediri tanpa data produsen telur/ayam).
  agregasi: "bulanan"                # harga produsen jarang diperbarui (produsen > pedagang besar di 31% kota-hari) -> bulanan

paths:
  raw: "data/raw"
  interim: "data/interim"
  processed: "data/processed"
  reference: "data/reference"
  log_unduhan: "data/raw/_log.csv"
